name: Refresh directory

on:
  # Scheduled trigger is paused until this app has a public deployment (REFRESH_URL secret) —
  # GitHub's cloud runner can't reach a localhost dev instance, so the schedule just fails and
  # emails on every run. Re-add the `schedule:` block below once REFRESH_URL and ADMIN_TOKEN
  # repo secrets are set to a reachable deployment.
  #
  # schedule:
  #   - cron: "0 */8 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh
        run: |
          curl -sf -X POST "${{ secrets.REFRESH_URL }}/api/refresh" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            --max-time 300
